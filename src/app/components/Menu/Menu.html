<div class="sidebar-container">

    <span class="logo-icone">CR</span>

      <h3>CERESP</h3>
      <p>Painel Digital</p>
    </div>
  </div>

  <nav class="sidebar-nav" aria-label="Menu principal">
    <div class="menu-categoria">Controle de Detentos</div>

    <a
      routerLink="/condenacoes"
      routerLinkActive="active"
      class="menu-item"
      [routerLinkActiveOptions]="{ exact: true }"
    >

      <span>Condenacoes</span>
    </a>

    <a
      routerLink="/ocorrencias"
      routerLinkActive="active"

    <a
      routerLink="/tipos-atividade"
      routerLinkActive="active"

      <span>Tipos de Atividade</span>
    </a>

  <div class="sidebar-footer">
    <span class="usuario-status"></span>
